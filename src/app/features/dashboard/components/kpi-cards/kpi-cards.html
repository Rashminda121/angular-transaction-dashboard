<a
  [routerLink]="route()"
  [queryParams]="queryParams()"
  class="block rounded-2xl border border-slate-200 bg-white p-5 text-center shadow-sm transition-all hover:-translate-y-1 hover:shadow-md sm:text-left"
>
  <p class="text-sm font-medium text-slate-500">
    {{ title() }}
  </p>

  <h2 class="mt-3 text-3xl font-bold sm:text-4xl" [class]="valueClass()">
    {{ value() }}
  </h2>

  <p class="mt-3 text-sm text-slate-500">
    {{ description() }}
  </p>
</a>
