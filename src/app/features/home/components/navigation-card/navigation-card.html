<a
  [routerLink]="routerLink()"
  class="group flex h-full flex-col rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-blue-300 hover:shadow-xl sm:p-8"
>
  <!-- Icon -->

  <div
    class="flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-100 text-blue-600 transition-colors duration-300 group-hover:bg-blue-600 group-hover:text-white"
  >
    <lucide-angular [img]="icon()" class="h-8 w-8"></lucide-angular>
  </div>

  <!-- Content -->

  <div class="mt-6 flex-1">
    <h2 class="text-xl font-bold text-slate-900 sm:text-2xl">
      {{ title() }}
    </h2>

    <p class="mt-4 text-sm leading-7 text-slate-600 sm:text-base">
      {{ description() }}
    </p>
  </div>

  <!-- Button -->

  <div
    class="mt-8 inline-flex items-center gap-2 font-semibold text-blue-600 transition-colors duration-300 group-hover:text-blue-700"
  >
    <span>{{ buttonText() }}</span>

    <lucide-angular
      [img]="Icons.ArrowRight"
      class="h-5 w-5 transition-transform duration-300 group-hover:translate-x-1"
    ></lucide-angular>
  </div>
</a>
